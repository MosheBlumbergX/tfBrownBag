# --- Terraform in CI ----------------------------------------------------------
# Brownbag topic 9: "GitHub integration".
#
# The same four commands you run locally, moved to where the team can see them:
#
#   pull request  ->  fmt check, validate, plan, and the plan posted as a
#                     comment on the PR. Read-only: a plan needs credentials
#                     but changes nothing.
#   merge to main ->  apply, gated behind a GitHub Environment so a human has
#                     to click approve.
#
# Two prerequisites, both one-offs:
#
#   1. Remote state. CI and your laptop must share one state file, or each
#      will plan a full rebuild of what the other created.
#      See terraform/backend.tf.example.
#
#   2. An IAM role GitHub can assume via OIDC - no long-lived AWS keys in
#      repository secrets. bootstrap/ creates the OIDC provider and the role,
#      trusted only for this repo's pull_request and environment:production
#      contexts. Apply it once by hand: terraform -chdir=bootstrap apply
#
# Repository settings to create:
#   Variables:   AWS_REGION
#   Secrets:     AWS_ROLE_ARN (a secret, not a variable, so the account ID in it
#                is masked in public logs), CONFLUENT_CLOUD_API_KEY,
#                CONFLUENT_CLOUD_API_SECRET
#   Environment: "production" with required reviewers

name: terraform

on:
  pull_request:
    paths: ["terraform/**", ".github/workflows/terraform.yml"]
  push:
    branches: [main]
    paths: ["terraform/**", ".github/workflows/terraform.yml"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for OIDC
  pull-requests: write # required to comment the plan

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  CONFLUENT_CLOUD_API_KEY: ${{ secrets.CONFLUENT_CLOUD_API_KEY }}
  CONFLUENT_CLOUD_API_SECRET: ${{ secrets.CONFLUENT_CLOUD_API_SECRET }}

jobs:
  plan:
    name: validate and plan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.14.2
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # Formatting is a diff, so make CI own it rather than review comments.
      - name: fmt
        run: terraform fmt -check -recursive -diff

      - name: init
        run: terraform init

      - name: validate
        run: terraform validate -no-color

      - name: plan
        id: plan
        run: |
          terraform plan -no-color -out=tfplan | tee plan.txt
          {
            echo 'stdout<<PLAN_EOF'
            # Trim to the last 200 lines: a PR comment caps at 65 536 chars.
            tail -200 plan.txt
            echo PLAN_EOF
          } >>"$GITHUB_OUTPUT"

      - name: comment the plan on the PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          PLAN: ${{ steps.plan.outputs.stdout }}
        with:
          script: |
            const body = `### \`terraform plan\`
            <details><summary>show plan</summary>

            \`\`\`terraform
            ${process.env.PLAN}
            \`\`\`

            </details>

            *by @${{ github.actor }} for \`${{ github.sha }}\`*`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const previous = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('### `terraform plan`'));

            // Update in place so a busy PR does not collect ten stale plans.
            if (previous) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo,
                comment_id: previous.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: context.issue.number, body,
              });
            }

      # Carry the exact plan forward, so apply cannot act on a different diff.
      - name: upload the plan
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tfplan
          path: terraform/tfplan
          retention-days: 5

  apply:
    name: apply
    needs: plan
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # Required reviewers on this environment are what make the apply a
    # deliberate act rather than a side effect of merging.
    environment: production
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.14.2
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: tfplan
          path: terraform

      - run: terraform init

      - name: apply
        run: terraform apply -no-color tfplan
